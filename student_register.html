<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register | SmartQueue</title>
  
  <!-- Modern Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Phosphor Icons & Tailwind -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 900: '#312e81' },
            surface: { light: '#f8fafc', dark: '#0f172a' }
          }
        }
      }
    }
  </script>
  <style>
    body { transition: background-color 0.3s, color 0.3s; }
    .dark body { background-color: #0f172a; color: #f8fafc; }

    /* Startup Card */
    .sq-card {
      background: white; border: 1px solid #e2e8f0; border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }
    .dark .sq-card { background: #1e293b; border-color: #334155; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); }

    /* Inputs */
    .sq-input {
      width: 100%;
      background: #f1f5f9; border: 1px solid transparent; border-radius: 12px;
      padding: 12px 16px 12px 42px; font-size: 14px; color: #0f172a;
      transition: all 0.2s; outline: none;
    }
    .sq-input:focus { background: white; border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99,102,241,0.1); }
    .dark .sq-input { background: #0f172a; color: white; border-color: #334155; }
    .dark .sq-input:focus { border-color: #4f46e5; box-shadow: 0 0 0 4px rgba(79,70,229,0.2); }

    /* Floating Navbar */
    .nav-floating {
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    .dark .nav-floating { background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255,255,255,0.1); }

    /* Abstract Hero Pattern */
    .hero-pattern { background-image: radial-gradient(#e2e8f0 1px, transparent 1px); background-size: 24px 24px; }
    .dark .hero-pattern { background-image: radial-gradient(#334155 1px, transparent 1px); }
  </style>
</head>
<body class="bg-surface-light text-slate-900 antialiased min-h-screen flex flex-col relative overflow-x-hidden">

  <!-- Background Pattern -->
  <div class="absolute inset-0 hero-pattern opacity-60 -z-10 [mask-image:linear-gradient(to_bottom,white,transparent)]"></div>

  <!-- Floating Pill Navbar -->
  <div class="fixed top-4 left-0 right-0 z-50 flex justify-center px-4">
    <nav class="nav-floating w-full max-w-5xl rounded-full px-5 py-2.5 flex justify-between items-center transition-colors">
      <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition">
        <div class="w-8 h-8 bg-brand-600 rounded-full flex items-center justify-center text-white">
          <i class="ph-bold ph-queue"></i>
        </div>
        <div>
          <span class="font-bold text-sm tracking-tight block leading-tight">SmartQueue</span>
          <span class="text-[10px] text-slate-500 uppercase tracking-widest font-semibold block">GH Raisoni</span>
        </div>
      </a>
      
      <div class="flex items-center gap-2">
        <button onclick="document.documentElement.classList.toggle('dark')" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition text-slate-600 dark:text-slate-300">
          <i class="ph-bold ph-moon"></i>
        </button>
      </div>
    </nav>
  </div>

  <!-- Main Auth Container -->
  <div class="flex-1 flex items-center justify-center p-6 mt-20 mb-10 z-10">
    <div class="max-w-md w-full sq-card p-8 sm:p-10">
      
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="w-12 h-12 bg-indigo-50 dark:bg-indigo-500/10 text-brand-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
          <i class="ph-fill ph-user-plus text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold mb-2">Create an account</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400">Join SmartQueue as a student</p>
      </div>

      <!-- Form -->
      <div class="space-y-5">
        
        <!-- Full Name Input -->
        <div>
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">Full Name</label>
          <div class="relative flex items-center">
            <i class="ph-bold ph-user absolute left-4 text-slate-400 text-lg"></i>
            <input id="name" type="text" placeholder="Your full name" class="sq-input"/>
          </div>
        </div>

        <!-- Email Input -->
        <div>
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">Email Address</label>
          <div class="relative flex items-center">
            <i class="ph-bold ph-envelope-simple absolute left-4 text-slate-400 text-lg"></i>
            <input id="email" type="email" placeholder="your@email.com" class="sq-input"/>
          </div>
        </div>

        <!-- Password Input -->
        <div>
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">Password</label>
          <div class="relative flex items-center">
            <i class="ph-bold ph-lock-key absolute left-4 text-slate-400 text-lg"></i>
            <input id="password" type="password" placeholder="Min 6 characters" class="sq-input"/>
          </div>
        </div>

        <!-- Messages -->
        <div id="error-msg" class="hidden bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 text-sm p-3 rounded-xl gap-2 items-center">
          <i class="ph-fill ph-warning-circle text-lg shrink-0"></i>
          <span id="error-text"></span>
        </div>

        <div id="success-msg" class="hidden bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-400 text-sm p-3 rounded-xl gap-2 items-center">
          <i class="ph-fill ph-check-circle text-lg shrink-0"></i>
          <span id="success-text"></span>
        </div>

        <!-- Submit Button -->
        <button onclick="registerStudent()" id="reg-btn" class="w-full py-3.5 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl transition shadow-lg shadow-brand-500/30 flex items-center justify-center gap-2 mt-2">
          Create Account <i class="ph-bold ph-arrow-right"></i>
        </button>

      </div>

      <hr class="border-slate-200 dark:border-slate-700 my-8"/>

      <!-- Login Link -->
      <p class="text-center text-sm text-slate-500 dark:text-slate-400 font-medium">
        Already have an account? 
        <a href="student-login.html" class="text-brand-600 dark:text-brand-400 font-bold hover:underline transition">Sign in here</a>
      </p>

    </div>
  </div>

  <script>
    // Helper to safely display messages
    function showMessage(type, msg) {
      const errEl = document.getElementById('error-msg');
      const succEl = document.getElementById('success-msg');
      
      errEl.classList.remove('flex'); errEl.classList.add('hidden');
      succEl.classList.remove('flex'); succEl.classList.add('hidden');

      if (type === 'error') {
        document.getElementById('error-text').textContent = msg;
        errEl.classList.remove('hidden'); errEl.classList.add('flex');
      } else if (type === 'success') {
        document.getElementById('success-text').textContent = msg;
        succEl.classList.remove('hidden'); succEl.classList.add('flex');
      }
    }
  </script>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    window.registerStudent = async function() {
      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('reg-btn');

      showMessage('clear', ''); // hide all messages

      if (!name || !email || !password) {
        showMessage('error', 'Please fill in all fields.');
        return;
      }

      btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> Creating account...';
      btn.disabled = true;
      btn.classList.add('opacity-70', 'cursor-not-allowed');

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, 'users', cred.user.uid), { name, email, role: 'student' });
        
        showMessage('success', 'Account created! Redirecting to login...');
        
        // Wait briefly so they see the success message, then redirect[cite: 4]
        setTimeout(() => { window.location.href = 'student-login.html'; }, 1800);
      } catch(error) {
        const msgs = {
          'auth/email-already-in-use': 'This email is already registered.',
          'auth/weak-password':        'Password must be at least 6 characters.',
        };
        showMessage('error', msgs[error.code] || 'Registration failed. Try again.');
        
        btn.innerHTML = 'Create Account <i class="ph-bold ph-arrow-right"></i>';
        btn.disabled = false;
        btn.classList.remove('opacity-70', 'cursor-not-allowed');
      }
    };

    // Press Enter to register
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') registerStudent();
    });
  </script>

</body>
</html>
