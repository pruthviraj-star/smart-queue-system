<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register | SmartQueue</title>
  <link rel="stylesheet" href="shared.css"/>
  <script src="theme.js"></script>
</head>
<body>

  <nav class="sq-nav">
    <a href="index.html" class="sq-logo">
      <div class="sq-logo-mark">Q</div>
      <div>
        <div class="sq-logo-name">SmartQueue</div>
        <div class="sq-logo-sub">GH Raisoni, Jalgaon</div>
      </div>
    </a>
    <div class="sq-nav-actions">
      <button id="theme-toggle" onclick="toggleTheme()" class="sq-btn sq-btn-ghost sq-btn-sm" style="width:36px;padding:7px;"></button>
    </div>
  </nav>

  <div class="sq-auth-wrap">
    <div class="sq-auth-card">

      <div class="sq-card sq-fade-in" style="padding: 40px;">
        <div style="margin-bottom:32px;">
          <h1 style="font-size:24px;font-weight:700;color:var(--text);margin-bottom:6px;">Create account</h1>
          <p style="font-size:14px;color:var(--text-sub);">Join SmartQueue as a student</p>
        </div>

        <div style="margin-bottom:18px;">
          <label class="sq-label">Full Name</label>
          <input id="name" type="text" placeholder="Your full name" class="sq-input"/>
        </div>

        <div style="margin-bottom:18px;">
          <label class="sq-label">Email</label>
          <input id="email" type="email" placeholder="your@email.com" class="sq-input"/>
        </div>

        <div style="margin-bottom:20px;">
          <label class="sq-label">Password</label>
          <input id="password" type="password" placeholder="Min 6 characters" class="sq-input"/>
        </div>

        <div id="error-msg"   class="sq-alert sq-alert-error"   style="margin-bottom:16px;"></div>
        <div id="success-msg" class="sq-alert sq-alert-success" style="margin-bottom:16px;"></div>

        <button onclick="registerStudent()" id="reg-btn" class="sq-btn sq-btn-primary sq-btn-full sq-btn-lg" style="margin-bottom:20px;">
          Create Account
        </button>

        <hr class="sq-divider"/>

        <p style="text-align:center;font-size:13px;color:var(--text-sub);">
          Already have an account? <a href="student-login.html" style="color:var(--accent);font-weight:600;text-decoration:none;">Login here</a>
        </p>
      </div>

    </div>
  </div>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    window.registerStudent = async function() {
      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorEl  = document.getElementById('error-msg');
      const successEl= document.getElementById('success-msg');
      const btn      = document.getElementById('reg-btn');

      errorEl.classList.remove('show');
      successEl.classList.remove('show');

      if (!name || !email || !password) {
        errorEl.textContent = 'Please fill in all fields.';
        errorEl.classList.add('show'); return;
      }

      btn.textContent = 'Creating account…';
      btn.disabled = true;

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, 'users', cred.user.uid), { name, email, role: 'student' });
        successEl.textContent = '✓ Account created! Redirecting…';
        successEl.classList.add('show');
        setTimeout(() => { window.location.href = 'student-login.html'; }, 1800);
      } catch(error) {
        const msgs = {
          'auth/email-already-in-use': 'This email is already registered.',
          'auth/weak-password':        'Password must be at least 6 characters.',
        };
        errorEl.textContent = msgs[error.code] || 'Registration failed. Try again.';
        errorEl.classList.add('show');
        btn.textContent = 'Create Account';
        btn.disabled = false;
      }
    };
  </script>

</body>
</html>
