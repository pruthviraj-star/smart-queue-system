<!DOCTYPE html>
<html lang="en" class="bg-surface-light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard | SmartQueue</title>
  
  <!-- Modern Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Phosphor Icons & Tailwind -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 900: '#312e81' },
            surface: { light: '#f8fafc', dark: '#0f172a' }
          }
        }
      }
    }
  </script>
  <style>
    body { transition: background-color 0.3s, color 0.3s; }
    .dark body { background-color: #0f172a; color: #f8fafc; }
    
    .sq-card {
      background: white; border: 1px solid #e2e8f0; border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); transition: all 0.2s ease-in-out;
    }
    .dark .sq-card { background: #1e293b; border-color: #334155; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
    .sq-card:hover { transform: translateY(-2px); border-color: #cbd5e1; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    .dark .sq-card:hover { border-color: #475569; }

    /* Skeleton Animation */
    @keyframes pulse-soft {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
    .animate-pulse-soft { animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>
<body class="text-slate-900 antialiased min-h-screen pt-24 pb-12">

  <!-- Offline Banner -->
  <div id="offline-banner" class="fixed top-0 left-0 right-0 bg-red-500 text-white text-xs font-bold text-center py-2 z-[100] hidden flex items-center justify-center gap-2 shadow-md">
    <i class="ph-bold ph-wifi-slash text-base"></i> You are offline — check your connection.
  </div>

  <!-- Floating Navbar -->
  <div class="fixed top-4 left-0 right-0 z-50 flex justify-center px-4">
    <nav class="w-full max-w-4xl rounded-full px-6 py-3 flex justify-between items-center bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border border-slate-200 dark:border-slate-700 shadow-sm">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-brand-600 rounded-full flex items-center justify-center text-white">
          <i class="ph-bold ph-queue"></i>
        </div>
        <div class="hidden sm:block">
          <span class="font-bold text-sm tracking-tight block leading-tight">SmartQueue</span>
          <span class="text-[10px] text-slate-500 uppercase tracking-widest font-semibold block">Student</span>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="user-name" class="text-xs font-semibold text-slate-600 dark:text-slate-300">Loading...</span>
        </div>
        <button onclick="logout()" class="p-2 text-slate-500 hover:text-red-500 dark:hover:text-red-400 transition rounded-full hover:bg-slate-100 dark:hover:bg-slate-800">
          <i class="ph-bold ph-sign-out text-lg"></i>
        </button>
      </div>
    </nav>
  </div>

  <div class="max-w-3xl mx-auto px-6">
    <!-- Header -->
    <div class="mb-10 animate-fade-in">
      <p class="text-brand-600 dark:text-brand-400 text-xs font-bold uppercase tracking-wider mb-2">Student Dashboard</p>
      <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight mb-2 flex items-center gap-2">
        Hello, <span id="greeting-name">there</span> <i class="ph-fill ph-hand-waving text-brand-500"></i>
      </h2>
      <p class="text-slate-600 dark:text-slate-400 text-sm">Select a department to join its virtual queue.</p>
    </div>

    <!-- Queue List -->
    <div id="queue-list" class="space-y-4"></div>
  </div>

  <!-- Chatbot Widget -->
  <button id="chat-btn" onclick="toggleChat()" class="fixed bottom-6 right-6 z-50 w-14 h-14 bg-brand-600 hover:bg-brand-500 text-white rounded-full flex items-center justify-center shadow-lg shadow-brand-500/30 transition-transform hover:scale-105 border-2 border-white dark:border-slate-800">
    <i class="ph-fill ph-chat-teardrop-dots text-2xl"></i>
  </button>

  <div id="chat-window" class="fixed bottom-24 right-6 z-50 w-80 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-2xl hidden flex-col overflow-hidden">
    <!-- Chat Header -->
    <div class="bg-brand-600 p-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center text-white">
          <i class="ph-fill ph-robot text-lg"></i>
        </div>
        <div>
          <div class="text-sm font-bold text-white leading-tight">Queue Assistant</div>
          <div class="text-[10px] text-brand-100">Ask me anything</div>
        </div>
      </div>
      <button onclick="toggleChat()" class="text-white hover:text-brand-200 transition">
        <i class="ph-bold ph-x text-lg"></i>
      </button>
    </div>

    <!-- Messages -->
    <div id="chat-messages" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 max-h-80 bg-slate-50 dark:bg-slate-900/50">
      <div class="bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 p-3 rounded-2xl rounded-tl-sm text-sm text-slate-700 dark:text-slate-300 max-w-[85%] shadow-sm">
        Hi! I'm the SmartQueue Assistant. Need help joining a queue or checking wait times?
      </div>
    </div>

    <!-- Input -->
    <div class="p-3 border-t border-slate-100 dark:border-slate-700 bg-white dark:bg-slate-800 flex gap-2">
      <input id="chat-input" type="text" placeholder="Type a message..." class="flex-1 bg-slate-100 dark:bg-slate-900 border-none rounded-xl px-4 text-sm focus:ring-2 focus:ring-brand-500 text-slate-900 dark:text-white placeholder-slate-400" onkeydown="if(event.key==='Enter') sendMessage()" />
      <button onclick="sendMessage()" class="w-10 h-10 bg-brand-600 hover:bg-brand-500 text-white rounded-xl flex items-center justify-center transition">
        <i class="ph-bold ph-paper-plane-right"></i>
      </button>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, getDocs, doc, getDoc, addDoc, runTransaction, query, where, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    let currentUser = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'student-login.html'; return; }
      currentUser = user;
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      if (userDoc.exists()) {
        const name = userDoc.data().name.split(' ')[0];
        document.getElementById('user-name').textContent = name;
        document.getElementById('greeting-name').textContent = name;
      }
      loadQueues();
    });

    async function loadQueues() {
      const list = document.getElementById('queue-list');

      // Modern Skeletons
      list.innerHTML = [1,2,3].map(() => `
        <div class="sq-card p-5 flex items-center gap-4 animate-pulse-soft">
          <div class="w-14 h-14 bg-slate-200 dark:bg-slate-700 rounded-xl shrink-0"></div>
          <div class="flex-1 space-y-2">
            <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div>
            <div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-1/3"></div>
          </div>
          <div class="w-20 h-10 bg-slate-200 dark:bg-slate-700 rounded-xl shrink-0"></div>
        </div>`).join('');

      const queuesSnapshot = await getDocs(collection(db, 'queues'));
      list.innerHTML = '';

      // Phosphor Icons mapping
      const icons = { fees_counter: 'ph-wallet', admissions: 'ph-file-text', scholarship: 'ph-graduation-cap' };

      for (const queueDoc of queuesSnapshot.docs) {
        const queue = queueDoc.data();
        const queueId = queueDoc.id;

        const waitingSnap = await getDocs(query(collection(db, 'queues', queueId, 'tokens'), where('status', '==', 'waiting')));
        const waiting = waitingSnap.size;

        const iconClass = icons[queueId] || 'ph-buildings';
        const isActive = queue.isActive !== false;
        
        const waitText = waiting === 0 ? 'No Wait' : `${waiting} waiting`;
        const waitBg = waiting === 0 ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400' : 'bg-orange-100 text-orange-700 dark:bg-orange-900/30 dark:text-orange-400';

        const card = document.createElement('div');
        card.className = `sq-card p-5 flex items-center gap-5 ${!isActive ? 'opacity-70 grayscale' : ''}`;
        card.innerHTML = `
          <div class="w-14 h-14 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-2xl text-slate-700 dark:text-slate-300 shrink-0">
             <i class="ph-fill ${iconClass}"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-3 mb-1">
              <h4 class="text-base font-bold text-slate-900 dark:text-white truncate">${queue.deptName}</h4>
              ${isActive ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase ${waitBg}">${waitText}</span>` : `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400">Closed</span>`}
            </div>
            <p class="text-sm text-slate-500 dark:text-slate-400">Now serving: <strong class="text-slate-900 dark:text-white font-semibold">#${queue.currentCounter ?? 0}</strong></p>
          </div>
          ${isActive 
            ? `<button data-queue-id="${queueId}" onclick="joinQueue('${queueId}', '${queue.deptName}', this)" class="shrink-0 px-6 py-2.5 bg-brand-600 hover:bg-brand-500 text-white text-sm font-bold rounded-xl transition shadow-sm">Join</button>`
            : `<button disabled class="shrink-0 px-6 py-2.5 bg-slate-200 dark:bg-slate-700 text-slate-400 dark:text-slate-500 text-sm font-bold rounded-xl cursor-not-allowed"><i class="ph-bold ph-prohibit"></i></button>`
          }
        `;
        list.appendChild(card);
      }
    }

    // Keep your exact existing transaction logic here...
    window.joinQueue = async function(queueId, deptName, btnEl) {
      if (!currentUser) return;
      if (btnEl) { btnEl.textContent = '...'; btnEl.disabled = true; }
      
      try {
        const queuesSnap = await getDocs(collection(db, 'queues'));
        for (const qDoc of queuesSnap.docs) {
          const existing = await getDocs(query(collection(db, 'queues', qDoc.id, 'tokens'), where('studentId', '==', currentUser.uid), where('status', '==', 'waiting')));
          if (!existing.empty) {
            alert(`You are already in the ${qDoc.data().deptName} queue.`);
            if (btnEl) { btnEl.textContent = 'Join'; btnEl.disabled = false; }
            return;
          }
        }

        const userDoc = await getDoc(doc(db, 'users', currentUser.uid));
        const studentName = userDoc.data()?.name || 'Student';
        const queueRef = doc(db, 'queues', queueId);
        let newTokenNumber;

        await runTransaction(db, async (transaction) => {
          const queueSnap = await transaction.get(queueRef);
          if (!queueSnap.exists()) throw new Error(`Queue does not exist.`);
          newTokenNumber = (queueSnap.data().lastToken ?? 0) + 1;
          transaction.update(queueRef, { lastToken: increment(1) });
        });

        const tokenRef = await addDoc(collection(db, 'queues', queueId, 'tokens'), {
          tokenNumber: newTokenNumber, studentId: currentUser.uid, studentName: studentName, status: 'waiting', timestamp: new Date()
        });

        window.location.href = `student-token.html?queueId=${queueId}&tokenId=${tokenRef.id}`;
      } catch (error) {
        alert('Failed to join queue. Please try again.');
        if (btnEl) { btnEl.textContent = 'Join'; btnEl.disabled = false; }
      }
    };

    window.logout = async function() {
      await signOut(auth);
      window.location.href = 'student-login.html';
    };

    function updateOnlineStatus() {
      const banner = document.getElementById('offline-banner');
      if (!navigator.onLine) banner.classList.remove('hidden');
      else banner.classList.add('hidden');
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
  </script>

  <!-- Chatbot Logic -->
  <script>
    function toggleChat() {
      const win = document.getElementById('chat-window');
      win.classList.toggle('hidden');
      win.classList.toggle('flex');
      if (!win.classList.contains('hidden')) document.getElementById('chat-input').focus();
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const messages = document.getElementById('chat-messages');
      const message = input.value.trim();
      if (!message) return;

      const userMsg = document.createElement('div');
      userMsg.className = 'bg-brand-600 text-white p-3 rounded-2xl rounded-tr-sm text-sm max-w-[85%] self-end shadow-sm';
      userMsg.textContent = message;
      messages.appendChild(userMsg);
      input.value = '';
      messages.scrollTop = messages.scrollHeight;

      // Add a simple timeout mockup for bot reply
      setTimeout(() => {
        const botMsg = document.createElement('div');
        botMsg.className = 'bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 p-3 rounded-2xl rounded-tl-sm text-sm text-slate-700 dark:text-slate-300 max-w-[85%] shadow-sm';
        botMsg.textContent = "I am currently running in demo mode, but I can assist you with queue info soon!";
        messages.appendChild(botMsg);
        messages.scrollTop = messages.scrollHeight;
      }, 1000);
    }
  </script>
</body>
</html>
