<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Login | SmartQueue</title>
  <link rel="stylesheet" href="shared.css"/>
  <script src="theme.js"></script>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

  <nav class="sq-nav">
    <a href="index.html" class="sq-logo">
      <div class="sq-logo-mark">Q</div>
      <div>
        <div class="sq-logo-name">SmartQueue</div>
        <div class="sq-logo-sub">GH Raisoni, Jalgaon</div>
      </div>
    </a>
    <div class="sq-nav-actions">
      <a href="staff-login.html" class="sq-btn sq-btn-ghost sq-btn-sm">Staff Portal</a>
      <button id="theme-toggle" onclick="toggleTheme()" class="sq-btn sq-btn-ghost sq-btn-sm" style="width:36px;padding:7px;"></button>
    </div>
  </nav>

  <div class="sq-auth-wrap">
    <div class="sq-auth-card">

      <div class="sq-card sq-fade-in" style="padding: 40px;">
        <div style="margin-bottom:32px;">
          <h1 style="font-size:24px;font-weight:700;color:var(--text);margin-bottom:6px;">Welcome back</h1>
          <p style="font-size:14px;color:var(--text-sub);">Login to your student account</p>
        </div>

        <div style="margin-bottom:18px;">
          <label class="sq-label">Email</label>
          <input id="email" type="email" placeholder="your@email.com" class="sq-input"/>
        </div>

        <div style="margin-bottom:20px;">
          <label class="sq-label">Password</label>
          <input id="password" type="password" placeholder="••••••••" class="sq-input"/>
        </div>

        <div id="error-msg" class="sq-alert sq-alert-error" style="margin-bottom:16px;"></div>

        <!-- reCAPTCHA v2 — hidden on localhost, shown on production -->
        <div id="captcha-wrap" style="margin-bottom:16px;display:none;">
          <div class="g-recaptcha"
            data-sitekey="6LfCjhwtAAAAAIYD0Xwi0mH-TXbWNR8XrV5zvmcL">
          </div>
        </div>

        <button onclick="loginStudent()" id="login-btn" class="sq-btn sq-btn-primary sq-btn-full sq-btn-lg" style="margin-bottom:16px;">
          Login
        </button>

        <p style="text-align:center;font-size:12px;color:var(--text-dim);">
          <a href="#" onclick="forgotPassword(); return false;" style="color:var(--text-sub);text-decoration:none;">Forgot password?</a>
        </p>

        <hr class="sq-divider"/>

        <p style="text-align:center;font-size:13px;color:var(--text-sub);">
          No account? <a href="student_register.html" style="color:var(--accent);font-weight:600;text-decoration:none;">Register here</a>
        </p>
      </div>

    </div>
  </div>

  <script>
    // Show CAPTCHA only on production
    const isLocalhost = window.location.hostname === 'localhost' ||
                        window.location.hostname === '127.0.0.1';
    if (!isLocalhost) {
      document.getElementById('captcha-wrap').style.display = 'block';
    }
  </script>

  <script type="module">
    import { auth } from './firebase-config.js';
    import { signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    window.loginStudent = async function() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorEl  = document.getElementById('error-msg');
      const btn      = document.getElementById('login-btn');

      errorEl.classList.remove('show');

      // reCAPTCHA check — only on production
      const isLocalhost = window.location.hostname === 'localhost' ||
                          window.location.hostname === '127.0.0.1';
      if (!isLocalhost) {
        const captchaResponse = grecaptcha.getResponse();
        if (!captchaResponse) {
          errorEl.textContent = 'Please complete the CAPTCHA verification.';
          errorEl.classList.add('show');
          return;
        }
      }

      btn.textContent = 'Logging in…';
      btn.disabled = true;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'student-dashboard.html';
      } catch {
        errorEl.textContent = 'Invalid email or password.';
        errorEl.classList.add('show');
        btn.textContent = 'Login';
        btn.disabled = false;
        if (!isLocalhost && typeof grecaptcha !== 'undefined') grecaptcha.reset();
      }
    };

    window.forgotPassword = async function() {
      const email = document.getElementById('email').value.trim();
      if (!email) { alert('Enter your email first, then click Forgot password.'); return; }
      try {
        await sendPasswordResetEmail(auth, email);
        alert('Reset email sent — check your inbox and spam.');
      } catch(e) {
        alert('Could not send reset email: ' + e.message);
      }
    };

    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') loginStudent();
    });
  </script>

</body>
</html>
