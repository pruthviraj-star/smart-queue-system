<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Token | SmartQueue</title>
  <link rel="stylesheet" href="shared.css"/>
  <script src="theme.js"></script>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#0071e3"/>
  <style>
    .token-section {
      text-align: center; padding: 40px 28px;
    }
    .token-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 28px;
    }
    .dept-name {
      font-size: 14px; color: var(--text-sub); margin-top: 16px; margin-bottom: 20px;
    }
    .stats-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    }
    .info-box {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 16px; background: var(--bg); border: 1px solid var(--border-s);
      border-radius: 14px; font-size: 13px; color: var(--text-sub);
    }
  </style>
</head>
<body>

  <div id="offline-banner">📵 You are offline — showing last known data.</div>

  <nav class="sq-nav">
    <a href="student-dashboard.html" class="sq-logo">
      <div class="sq-logo-mark">Q</div>
      <div>
        <div class="sq-logo-name">SmartQueue</div>
        <div class="sq-logo-sub">Your Token</div>
      </div>
    </a>
    <div class="sq-nav-actions">
      <button onclick="logout()" class="sq-btn sq-btn-ghost sq-btn-sm">Logout</button>
    </div>
  </nav>

  <div style="max-width:480px;margin:0 auto;padding:40px 20px;display:flex;flex-direction:column;gap:14px;">

    <!-- Token Card -->
    <div class="sq-card sq-fade-in token-section">
      <div class="token-label">Your Token Number</div>

      <div id="token-ring" class="sq-token-ring">
        <span id="token-number" class="sq-token-num">--</span>
      </div>

      <div id="dept-name" class="dept-name"></div>

      <div id="status-badge" class="sq-badge sq-badge-waiting" style="margin:0 auto;">
        <span style="width:6px;height:6px;border-radius:50%;background:currentColor;opacity:0.7;display:inline-block;animation:livePulse 2s infinite;"></span>
        Waiting in queue
      </div>
    </div>

    <!-- Stats -->
    <div class="sq-card sq-fade-in">
      <div class="stats-grid">
        <div class="sq-stat">
          <div class="sq-stat-label">Now Serving</div>
          <div id="current-counter" class="sq-stat-value">--</div>
        </div>
        <div class="sq-stat">
          <div class="sq-stat-label">Your Position</div>
          <div id="your-position" class="sq-stat-value">--</div>
        </div>
        <div class="sq-stat">
          <div class="sq-stat-label">Est. Wait</div>
          <div id="est-wait" class="sq-stat-value" style="font-size:24px;">--</div>
        </div>
      </div>
      <p id="ai-label" style="display:none;text-align:center;font-size:11px;color:var(--text-dim);margin-top:14px;">
        🤖 Wait time based on real service history
      </p>
    </div>

    <!-- Info -->
    <div class="info-box sq-fade-in">
      <span style="font-size:20px;flex-shrink:0;">💡</span>
      <span>You can close this page and come back — your token is saved.</span>
    </div>

    <!-- Leave Queue -->
    <button onclick="leaveQueue()" class="sq-btn sq-btn-danger sq-btn-full sq-btn-lg sq-fade-in">
      Leave Queue
    </button>

    <p style="text-align:center;font-size:11px;color:var(--text-dim);">🔴 Updates automatically in real-time</p>

  </div>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      doc, onSnapshot, deleteDoc,
      getDocs, collection, query, where, orderBy, limit
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const params  = new URLSearchParams(window.location.search);
    const queueId = params.get('queueId');
    const tokenId = params.get('tokenId');
    if (!queueId || !tokenId) window.location.href = 'student-dashboard.html';

    let avgServiceTime = 5 * 60;
    let unsubToken = null, unsubQueue = null;
    let lastPosition = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'student-login.html'; return; }
      await requestNotificationPermission();
      await loadAvgServiceTime();
      startListening();
    });

    async function loadAvgServiceTime() {
      try {
        const snap = await getDocs(query(
          collection(db, 'queues', queueId, 'tokens'),
          where('status', '==', 'complete'),
          where('serviceDuration', '!=', null),
          orderBy('serviceDuration'), limit(10)
        ));
        if (snap.empty) return;
        let total = 0, count = 0;
        snap.forEach(d => {
          const dur = d.data().serviceDuration;
          if (dur > 0 && dur < 3600) { total += dur; count++; }
        });
        if (count > 0) {
          avgServiceTime = Math.round(total / count);
          document.getElementById('ai-label').style.display = 'block';
        }
      } catch { /* use default */ }
    }

    function formatWait(secs) {
      if (secs < 60) return secs + 's';
      const m = Math.round(secs / 60);
      if (m < 60) return m + 'm';
      return Math.floor(m/60) + 'h ' + (m%60) + 'm';
    }

    async function requestNotificationPermission() {
  if (!('serviceWorker' in navigator)) return false;
  
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    const permission = await Notification.requestPermission();
    return permission === 'granted';
  } catch(e) {
    console.error('SW registration failed:', e);
    return false;
  }
}

    async function notify(title, body) {
  if (!('serviceWorker' in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    await reg.showNotification(title, {
      body,
      icon: 'https://cdn-icons-png.flaticon.com/512/1827/1827392.png',
      badge: 'https://cdn-icons-png.flaticon.com/512/1827/1827392.png',
      vibrate: [200, 100, 200],
      tag: 'smartqueue-update',
      renotify: true
    });
  } catch(e) {
    console.error('Notification error:', e);
  }
}

    function startListening() {
      // Listen to token doc
      unsubToken = onSnapshot(doc(db, 'queues', queueId, 'tokens', tokenId), snap => {
        if (!snap.exists()) { window.location.href = 'student-dashboard.html'; return; }
        const token  = snap.data();
        const ring   = document.getElementById('token-ring');
        const badge  = document.getElementById('status-badge');
        const numEl  = document.getElementById('token-number');

        numEl.textContent = token.tokenNumber;

        if (token.status === 'called') {
          ring.className = 'sq-token-ring called';
          badge.className = 'sq-badge sq-badge-called';
          badge.innerHTML = '<span style="width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;animation:livePulse 1s infinite;"></span> 🔔 Your Turn! Head to the counter.';
        } else if (token.status === 'complete') {
          ring.className = 'sq-token-ring';
          badge.className = 'sq-badge sq-badge-done';
          badge.textContent = '✓ Service Complete — Thank you!';
        }
      });

      // Listen to queue doc
      unsubQueue = onSnapshot(doc(db, 'queues', queueId), snap => {
        const queue = snap.data();
        document.getElementById('dept-name').textContent = queue.deptName;
        document.getElementById('current-counter').textContent = queue.currentCounter;

        const myNum = parseInt(document.getElementById('token-number').textContent);
        if (!isNaN(myNum)) {
          const position = myNum - queue.currentCounter;
          document.getElementById('your-position').textContent = position > 0 ? position : '🎉';
          document.getElementById('est-wait').textContent = position > 0 ? formatWait(position * avgServiceTime) : '0m';

          // Notify at key positions (only once per position change)
          if (position !== lastPosition) {
            if (position === 3) notify('⏰ Almost Your Turn!', `#${position} in ${queue.deptName} — get ready!`);
            if (position === 1) notify('🔔 You Are Next!', `Head to the ${queue.deptName} counter now.`);
            lastPosition = position;
          }
        }
      });
    }

    window.leaveQueue = async function() {
      if (!confirm('Leave the queue?')) return;
      if (unsubToken) unsubToken();
      if (unsubQueue) unsubQueue();
      await deleteDoc(doc(db, 'queues', queueId, 'tokens', tokenId));
      window.location.href = 'student-dashboard.html';
    };

    window.logout = async function() {
      if (unsubToken) unsubToken();
      if (unsubQueue) unsubQueue();
      await signOut(auth);
      window.location.href = 'student-login.html';
    };

    // Offline detection
    function updateOnlineStatus() {
      document.getElementById('offline-banner').classList.toggle('show', !navigator.onLine);
      const btn = document.querySelector('button[onclick="leaveQueue()"]');
      if (btn) { btn.disabled = !navigator.onLine; }
    }
    window.addEventListener('online',  updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
  </script>

</body>
</html>
