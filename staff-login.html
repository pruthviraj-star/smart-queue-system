<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Staff Login | SmartQueue</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #0f172a; min-height: 100vh; overflow-x: hidden; }
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(80px); opacity: 0.12;
      animation: orbFloat 8s ease-in-out infinite;
      pointer-events: none; z-index: 0;
    }
    .orb-1 { width: 400px; height: 400px; background: #22c55e; top: -100px; left: -100px; }
    .orb-2 { width: 300px; height: 300px; background: #06b6d4; bottom: -50px; right: -50px; animation-delay: 4s; }
    @keyframes orbFloat {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .input-field {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      color: white; transition: all 0.3s ease;
      width: 100%; border-radius: 12px;
      padding: 12px 16px; font-size: 14px;
    }
    .input-field:focus {
      outline: none;
      border-color: #22c55e;
      background: rgba(34,197,94,0.1);
      box-shadow: 0 0 20px rgba(34,197,94,0.2);
    }
    .input-field::placeholder { color: rgba(255,255,255,0.3); }
    .glow-btn {
      position: relative; overflow: hidden;
      transition: all 0.3s ease;
    }
    .glow-btn::before {
      content: ''; position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s ease;
    }
    .glow-btn:hover::before { left: 100%; }
    .glow-btn:hover { box-shadow: 0 0 30px rgba(34,197,94,0.5); transform: translateY(-2px); }
    .logo-shine {
      background: linear-gradient(135deg, #22c55e, #06b6d4);
      position: relative; overflow: hidden;
    }
    .logo-shine::after {
      content: ''; position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.3) 50%, transparent 60%);
      animation: shine 3s ease-in-out infinite;
    }
    @keyframes shine {
      0% { transform: translateX(-100%) rotate(45deg); }
      100% { transform: translateX(100%) rotate(45deg); }
    }
    .card-enter { animation: cardEnter 0.6s ease forwards; }
    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 text-white">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="w-full max-w-md relative z-10">
    <div class="text-center mb-8 card-enter">
      <a href="index.html">
        <div class="logo-shine w-16 h-16 rounded-2xl flex items-center justify-center font-bold text-2xl mx-auto mb-4 shadow-lg shadow-green-500/30">⚙️</div>
      </a>
      <h1 class="text-2xl font-extrabold text-white">Staff Portal</h1>
      <p class="text-slate-400 text-sm">SmartQueue — GH Raisoni College</p>
    </div>

    <div class="glass rounded-3xl p-8 card-enter" style="animation-delay:0.1s">
      <h2 class="text-2xl font-bold text-white mb-1">Staff Login 🔐</h2>
      <p class="text-slate-400 text-sm mb-8">Access the queue management dashboard</p>

      <div class="mb-5">
        <label class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2 block">Staff Email</label>
        <input id="email" type="email" placeholder="staff@raisoni.com" class="input-field"/>
      </div>

      <div class="mb-5">
        <label class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2 block">Password</label>
        <input id="password" type="password" placeholder="••••••••" class="input-field"/>
      </div>

      <p id="error-msg" class="text-red-400 text-sm mb-4 hidden bg-red-500/10 border border-red-500/20 rounded-xl px-3 py-2"></p>

      <button onclick="loginStaff()" id="login-btn"
        class="glow-btn w-full bg-green-600 text-white py-3 rounded-xl font-bold text-base mb-6">
        Login as Staff →
      </button>

      <div class="border-t border-white/5 pt-5">
        <p class="text-center text-slate-500 text-xs">
          Student? <a href="student-login.html" class="text-slate-400 hover:text-white">Student Login →</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    window.loginStaff = async function() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      const btn = document.getElementById('login-btn');
      btn.textContent = 'Logging in...';
      btn.disabled = true;
      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        if (userDoc.exists() && userDoc.data().role === 'staff') {
          window.location.href = 'staff-dashboard.html';
        } else {
          errorMsg.classList.remove('hidden');
          errorMsg.textContent = '⚠️ Access denied. Not a staff account.';
          await auth.signOut();
          btn.textContent = 'Login as Staff →';
          btn.disabled = false;
        }
      } catch (error) {
        errorMsg.classList.remove('hidden');
        errorMsg.textContent = '⚠️ Invalid email or password.';
        btn.textContent = 'Login as Staff →';
        btn.disabled = false;
      }
    }

    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loginStaff();
    });
  </script>
</body>
</html>
