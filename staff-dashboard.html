<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Staff Dashboard | SmartQueue</title>
  <link rel="stylesheet" href="shared.css"/>
  <script src="theme.js"></script>
  <style>
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }

    /* Queue status toggle */
    .sq-toggle-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px; border-radius: 16px;
      border: 1px solid var(--border-s);
      background: var(--bg);
      transition: all 0.3s;
    }
    .sq-toggle-label { font-size: 13px; font-weight: 600; color: var(--text); }
    .sq-toggle-sub   { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

    .sq-toggle-btn {
      width: 52px; height: 28px; border-radius: 999px;
      border: none; cursor: pointer; position: relative;
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .sq-toggle-btn::after {
      content: '';
      position: absolute; top: 3px; left: 3px;
      width: 22px; height: 22px; border-radius: 50%;
      background: white;
      transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .sq-toggle-btn.open   { background: #34c759; }
    .sq-toggle-btn.closed { background: #aeaeb2; }
    .sq-toggle-btn.open::after   { transform: translateX(24px); }
    .sq-toggle-btn.closed::after { transform: translateX(0); }

    /* Closed overlay on action buttons */
    .sq-closed-notice {
      display: none;
      text-align: center; padding: 20px;
      background: rgba(255,59,48,0.05);
      border: 1px solid rgba(255,59,48,0.15);
      border-radius: 16px;
      color: #ff3b30; font-size: 13px; font-weight: 600;
    }
  </style>
</head>
<body>

  <nav class="sq-nav">
    <a href="index.html" class="sq-logo">
      <div class="sq-logo-mark">⚙</div>
      <div>
        <div class="sq-logo-name">Staff Panel</div>
        <div class="sq-logo-sub">SmartQueue Management</div>
      </div>
    </a>
    <div class="sq-nav-actions">
      <div style="display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;border:1px solid var(--border-s);background:var(--bg-card);">
        <span class="sq-live-dot"></span>
        <span id="staff-name" style="font-size:12px;color:var(--text-sub);font-weight:500;"></span>
      </div>
      <button onclick="logout()" class="sq-btn sq-btn-ghost sq-btn-sm">Logout</button>
    </div>
  </nav>

  <div style="max-width:640px;margin:0 auto;padding:40px 20px;display:flex;flex-direction:column;gap:14px;">

    <!-- Queue selector -->
    <div class="sq-card sq-fade-in">
      <label class="sq-label">Select Department Queue</label>
      <select id="queue-select" onchange="loadQueue()" class="sq-input sq-select">
        <option value="">-- Select a Department --</option>
      </select>
    </div>

    <!-- Control panel -->
    <div id="control-panel" style="display:none;flex-direction:column;gap:14px;">

      <!-- Queue open/close toggle -->
      <div class="sq-card sq-fade-in">
        <div class="sq-toggle-row">
          <div>
            <div class="sq-toggle-label">Queue Status</div>
            <div id="toggle-sub" class="sq-toggle-sub">Queue is open — students can join</div>
          </div>
          <button id="queue-toggle-btn" class="sq-toggle-btn open" onclick="toggleQueueStatus()"></button>
        </div>
      </div>

      <!-- Live stats -->
      <div class="sq-card sq-fade-in">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;">
          <span class="sq-live-dot"></span>
          <span style="font-size:12px;font-weight:600;color:var(--text-sub);">Live Queue Data</span>
        </div>
        <div class="stats-grid">
          <div class="sq-stat">
            <div class="sq-stat-label">Now Serving</div>
            <div id="current-counter" class="sq-stat-value" style="color:var(--accent);">0</div>
          </div>
          <div class="sq-stat">
            <div class="sq-stat-label">Waiting</div>
            <div id="waiting-count" class="sq-stat-value">0</div>
          </div>
          <div class="sq-stat">
            <div class="sq-stat-label">Total Issued</div>
            <div id="last-token" class="sq-stat-value">0</div>
          </div>
        </div>
      </div>

      <!-- Closed notice (shown when queue is closed) -->
      <div id="closed-notice" class="sq-closed-notice">
        🚫 Queue is closed — students cannot join. Open the queue to enable actions.
      </div>

      <!-- Action buttons -->
      <div id="action-buttons">
        <div class="action-grid">
          <button onclick="callNext()" class="sq-btn sq-btn-primary sq-btn-lg">
            ➡️ Call Next
          </button>
          <button onclick="markComplete()" class="sq-btn sq-btn-ghost sq-btn-lg">
            ✅ Mark Complete
          </button>
        </div>
        <button onclick="resetQueue()" class="sq-btn sq-btn-danger sq-btn-full" style="padding:12px;">
          🔄 Reset Queue for Today
        </button>
      </div>

      <!-- Waiting list -->
      <div class="sq-card sq-fade-in">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
          <h3 style="font-size:16px;font-weight:600;color:var(--text);">Waiting List</h3>
          <span id="waiting-badge" class="sq-badge" style="background:var(--bg);border:1px solid var(--border-s);color:var(--text-sub);">0 students</span>
        </div>
        <div id="waiting-list">
          <p style="text-align:center;color:var(--text-dim);font-size:13px;padding:20px 0;">No students waiting.</p>
        </div>
      </div>

    </div>
  </div>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      doc, getDoc, getDocs, collection, onSnapshot,
      updateDoc, query, where, orderBy, deleteDoc, limit
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    let currentQueueId = null;
    let unsubQueue = null, unsubTokens = null;
    let isQueueActive = true;

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'staff-login.html'; return; }
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      if (!userDoc.exists() || userDoc.data().role !== 'staff') {
        alert('Access denied.'); await signOut(auth);
        window.location.href = 'staff-login.html'; return;
      }
      document.getElementById('staff-name').textContent = userDoc.data().name;
      loadQueueOptions();
    });

    async function loadQueueOptions() {
      const select = document.getElementById('queue-select');
      const snap = await getDocs(collection(db, 'queues'));
      snap.forEach(q => {
        const opt = document.createElement('option');
        opt.value = q.id;
        opt.textContent = q.data().deptName;
        select.appendChild(opt);
      });
    }

    window.loadQueue = function() {
      const select = document.getElementById('queue-select');
      currentQueueId = select.value;
      if (!currentQueueId) {
        document.getElementById('control-panel').style.display = 'none';
        return;
      }
      document.getElementById('control-panel').style.display = 'flex';

      if (unsubQueue)  unsubQueue();
      if (unsubTokens) unsubTokens();

      unsubQueue = onSnapshot(doc(db, 'queues', currentQueueId), snap => {
        const d = snap.data();
        document.getElementById('current-counter').textContent = d.currentCounter ?? 0;
        document.getElementById('last-token').textContent      = d.lastToken ?? 0;

        // Update toggle UI based on Firestore isActive value
        isQueueActive = d.isActive !== false; // default true if field missing
        updateToggleUI(isQueueActive);
      });

      unsubTokens = onSnapshot(
        query(collection(db, 'queues', currentQueueId, 'tokens'),
          where('status', '==', 'waiting'), orderBy('tokenNumber')),
        snap => {
          const count = snap.size;
          document.getElementById('waiting-count').textContent = count;
          document.getElementById('waiting-badge').textContent = count + ' students';

          const list = document.getElementById('waiting-list');
          list.innerHTML = '';
          if (snap.empty) {
            list.innerHTML = '<p style="text-align:center;color:var(--text-dim);font-size:13px;padding:20px 0;">No students waiting.</p>';
            return;
          }
          snap.forEach(tokenDoc => {
            const t = tokenDoc.data();
            const row = document.createElement('div');
            row.className = 'sq-row';
            row.innerHTML = `
              <div style="display:flex;align-items:center;gap:12px;">
                <div style="width:36px;height:36px;border-radius:10px;background:var(--bg);border:1px solid var(--border-s);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--text);">${t.tokenNumber}</div>
                <div>
                  <div style="font-size:14px;font-weight:600;color:var(--text);">${t.studentName}</div>
                  <div style="font-size:11px;color:var(--text-dim);">Token #${t.tokenNumber}</div>
                </div>
              </div>
              <span class="sq-badge sq-badge-waiting">Waiting</span>`;
            list.appendChild(row);
          });
        }
      );
    };

    function updateToggleUI(active) {
      const btn     = document.getElementById('queue-toggle-btn');
      const sub     = document.getElementById('toggle-sub');
      const notice  = document.getElementById('closed-notice');
      const actions = document.getElementById('action-buttons');

      if (active) {
        btn.className = 'sq-toggle-btn open';
        sub.textContent = 'Queue is open — students can join';
        notice.style.display  = 'none';
        actions.style.display = 'block';
      } else {
        btn.className = 'sq-toggle-btn closed';
        sub.textContent = 'Queue is closed — students cannot join';
        notice.style.display  = 'block';
        actions.style.display = 'none';
      }
    }

    window.toggleQueueStatus = async function() {
      if (!currentQueueId) return;
      const newStatus = !isQueueActive;
      const label = newStatus ? 'open' : 'close';
      if (!confirm(`Are you sure you want to ${label} this queue?`)) return;
      await updateDoc(doc(db, 'queues', currentQueueId), { isActive: newStatus });
      // UI updates automatically via onSnapshot
    };

    window.callNext = async function() {
      if (!currentQueueId) return;
      const nextSnap = await getDocs(query(
        collection(db, 'queues', currentQueueId, 'tokens'),
        where('status', '==', 'waiting'), orderBy('tokenNumber', 'asc'), limit(1)
      ));
      if (nextSnap.empty) { alert('No more students waiting.'); return; }
      const nextDoc = nextSnap.docs[0];
      const nextNum = nextDoc.data().tokenNumber;
      await updateDoc(nextDoc.ref, { status: 'called', calledAt: new Date() });
      await updateDoc(doc(db, 'queues', currentQueueId), { currentCounter: nextNum });
    };

    window.markComplete = async function() {
      if (!currentQueueId) return;
      const qSnap   = await getDoc(doc(db, 'queues', currentQueueId));
      const current = qSnap.data().currentCounter;
      const tSnap   = await getDocs(query(
        collection(db, 'queues', currentQueueId, 'tokens'),
        where('tokenNumber', '==', current)
      ));
      tSnap.forEach(async tDoc => {
        const calledAt = tDoc.data().calledAt?.toDate();
        const completedAt = new Date();
        const serviceDuration = calledAt ? Math.round((completedAt - calledAt) / 1000) : null;
        await updateDoc(tDoc.ref, { status: 'complete', completedAt, serviceDuration });
      });
    };

    window.resetQueue = async function() {
      if (!currentQueueId) return;
      if (!confirm('⚠️ Reset queue for today?\n\nThis will set counters to 0 and delete all tokens. Cannot be undone.')) return;
      try {
        await updateDoc(doc(db, 'queues', currentQueueId), { currentCounter: 0, lastToken: 0 });
        const tSnap = await getDocs(collection(db, 'queues', currentQueueId, 'tokens'));
        await Promise.all(tSnap.docs.map(d => deleteDoc(d.ref)));
        alert('✓ Queue reset successfully.');
      } catch { alert('Reset failed. Try again.'); }
    };

    window.logout = async function() {
      if (unsubQueue)  unsubQueue();
      if (unsubTokens) unsubTokens();
      await signOut(auth);
      window.location.href = 'staff-login.html';
    };
  </script>

</body>
</html>
