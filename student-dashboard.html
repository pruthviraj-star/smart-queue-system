<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard | SmartQueue</title>
  <link rel="stylesheet" href="shared.css"/>
  <script src="theme.js"></script>
  <style>
    .queue-card {
      display: flex; justify-content: space-between; align-items: center;
      gap: 16px;
    }
    .queue-icon {
      width: 48px; height: 48px; border-radius: 12px;
      background: var(--bg); border: 1px solid var(--border-s);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .queue-info { flex: 1; min-width: 0; }
    .queue-name {
      font-size: 15px; font-weight: 600; color: var(--text);
      margin-bottom: 6px; line-height: 1.3;
    }
    .queue-meta { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
    .queue-meta span { color: var(--text-sub); font-weight: 500; }

    /* Skeleton */
    .sk-card { padding: 20px; display: flex; align-items: center; gap: 16px; }
    .sk-icon  { width:48px; height:48px; border-radius:12px; flex-shrink:0; }
    .sk-body  { flex:1; }
    .sk-line  { height:12px; border-radius:6px; margin-bottom:8px; }
    .sk-line.w50 { width:50%; }
    .sk-line.w33 { width:33%; margin-bottom:0; }
    .sk-btn   { width:60px; height:34px; border-radius:999px; flex-shrink:0; }
  </style>
</head>
<body>

  <div id="offline-banner">📵 You are offline — check your connection.</div>

  <nav class="sq-nav">
    <a href="index.html" class="sq-logo">
      <div class="sq-logo-mark">Q</div>
      <div>
        <div class="sq-logo-name">SmartQueue</div>
        <div class="sq-logo-sub">Student Portal</div>
      </div>
    </a>
    <div class="sq-nav-actions">
      <div style="display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;border:1px solid var(--border-s);background:var(--bg-card);">
        <span class="sq-live-dot"></span>
        <span id="user-name" style="font-size:12px;color:var(--text-sub);font-weight:500;"></span>
      </div>
      <button onclick="logout()" class="sq-btn sq-btn-ghost sq-btn-sm">Logout</button>
    </div>
  </nav>

  <div style="max-width:680px;margin:0 auto;padding:48px 20px;">

    <div class="sq-fade-in" style="margin-bottom:36px;">
      <p style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);margin-bottom:8px;">Student Dashboard</p>
      <h2 style="font-size:32px;font-weight:700;color:var(--text);">Hello, <span id="greeting-name">there</span> 👋</h2>
      <p style="font-size:14px;color:var(--text-sub);margin-top:6px;">Select a department to join its virtual queue.</p>
    </div>

    <div id="queue-list" style="display:flex;flex-direction:column;gap:12px;"></div>

  </div>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      collection, getDocs, doc, getDoc,
      addDoc, updateDoc, runTransaction,
      query, where, increment
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    let currentUser = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'student-login.html'; return; }
      currentUser = user;
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      if (userDoc.exists()) {
        const name = userDoc.data().name.split(' ')[0];
        document.getElementById('user-name').textContent = userDoc.data().name;
        document.getElementById('greeting-name').textContent = name;
      }
      loadQueues();
    });

    async function loadQueues() {
      const list = document.getElementById('queue-list');

      // Skeleton loaders
      list.innerHTML = [1,2,3].map(() => `
        <div class="sq-card sk-card">
          <div class="sq-skeleton sk-icon"></div>
          <div class="sk-body">
            <div class="sq-skeleton sk-line w50"></div>
            <div class="sq-skeleton sk-line w33"></div>
          </div>
          <div class="sq-skeleton sk-btn"></div>
        </div>`).join('');

      const queuesSnapshot = await getDocs(collection(db, 'queues'));
      list.innerHTML = '';

      const icons = { fees_counter: '💰', admissions: '📋', scholarship: '🎓' };

      for (const queueDoc of queuesSnapshot.docs) {
        const queue  = queueDoc.data();
        const queueId = queueDoc.id;

        // Accurate waiting count from subcollection
        const waitingSnap = await getDocs(
          query(collection(db, 'queues', queueId, 'tokens'), where('status', '==', 'waiting'))
        );
        const waiting = waitingSnap.size;

        const badgeClass = waiting === 0 ? 'sq-badge-low' : waiting <= 3 ? 'sq-badge-mid' : 'sq-badge-high';
        const waitText   = waiting === 0 ? '✓ No wait' : `${waiting} waiting`;
        const icon       = icons[queueId] || '🏢';

        const isActive = queue.isActive !== false;

        const card = document.createElement('div');
        card.className = 'sq-card sq-card-lift sq-fade-in queue-card';
        card.innerHTML = `
          <div class="queue-icon" style="${!isActive ? 'opacity:0.4;' : ''}">${icon}</div>
          <div class="queue-info">
            <div class="queue-name" style="${!isActive ? 'color:var(--text-dim);' : ''}">${queue.deptName}</div>
            <span class="sq-badge ${isActive ? badgeClass : 'sq-badge-done'}">${isActive ? waitText : 'Queue closed'}</span>
            <div class="queue-meta">Now serving: <span>#${queue.currentCounter ?? 0}</span></div>
          </div>
          ${isActive
            ? `<button data-queue-id="${queueId}" data-dept-name="${queue.deptName}" onclick="joinQueue('${queueId}', this.dataset.deptName, this)" class="sq-btn sq-btn-primary sq-btn-sm">Join</button>`
            : `<span class="sq-badge" style="background:rgba(255,59,48,0.08);color:#ff3b30;border:1px solid rgba(255,59,48,0.2);white-space:nowrap;flex-shrink:0;">🚫 Closed</span>`
          }`;
        list.appendChild(card);
      }
    }

    // ✅ FIX: Uses Firestore transaction so two students can't get same token number
    // ✅ FIX: Properly handles fees_counter and any queue document
    window.joinQueue = async function(queueId, deptName, btnEl) {
      if (!currentUser) return;

      // Disable the button immediately to prevent double-click
      if (btnEl) { btnEl.textContent = '…'; btnEl.disabled = true; }

      try {
        // Check if student is already in ANY active queue
        const queuesSnap = await getDocs(collection(db, 'queues'));
        for (const qDoc of queuesSnap.docs) {
          const existing = await getDocs(
            query(
              collection(db, 'queues', qDoc.id, 'tokens'),
              where('studentId', '==', currentUser.uid),
              where('status', '==', 'waiting')
            )
          );
          if (!existing.empty) {
            alert(`You are already in the ${qDoc.data().deptName} queue.\nLeave that queue first.`);
            if (btnEl) { btnEl.textContent = 'Join'; btnEl.disabled = false; }
            return;
          }
        }

        // Also check 'called' status (student was called but hasn't left)
        for (const qDoc of queuesSnap.docs) {
          const called = await getDocs(
            query(
              collection(db, 'queues', qDoc.id, 'tokens'),
              where('studentId', '==', currentUser.uid),
              where('status', '==', 'called')
            )
          );
          if (!called.empty) {
            alert(`You are currently being served at ${qDoc.data().deptName}.\nPlease complete that first.`);
            if (btnEl) { btnEl.textContent = 'Join'; btnEl.disabled = false; }
            return;
          }
        }

        // Get student name
        const userDoc = await getDoc(doc(db, 'users', currentUser.uid));
        const studentName = userDoc.data()?.name || 'Student';

        // ✅ Transaction: atomically increment lastToken and create token doc
        const queueRef = doc(db, 'queues', queueId);
        let newTokenNumber;

        await runTransaction(db, async (transaction) => {
          const queueSnap = await transaction.get(queueRef);

          // ✅ KEY FIX: If queue doc doesn't exist, create it (handles fees_counter missing doc)
          if (!queueSnap.exists()) {
            throw new Error(`Queue "${deptName}" does not exist in Firestore. Ask admin to create it.`);
          }

          const data = queueSnap.data();
          newTokenNumber = (data.lastToken ?? 0) + 1;

          // Update lastToken counter
          transaction.update(queueRef, { lastToken: increment(1) });
        });

        // Create token document in subcollection
        const tokenRef = await addDoc(collection(db, 'queues', queueId, 'tokens'), {
          tokenNumber:  newTokenNumber,
          studentId:    currentUser.uid,
          studentName:  studentName,
          status:       'waiting',
          timestamp:    new Date()
        });

        window.location.href = `student-token.html?queueId=${queueId}&tokenId=${tokenRef.id}`;

      } catch (error) {
        console.error('Join queue error:', error);
        alert(error.message.includes('does not exist')
          ? error.message
          : 'Failed to join queue. Please try again.');
        if (btnEl) { btnEl.textContent = 'Join'; btnEl.disabled = false; }
      }
    };

    window.logout = async function() {
      await signOut(auth);
      window.location.href = 'student-login.html';
    };

    // Offline detection
    function updateOnlineStatus() {
      document.getElementById('offline-banner').classList.toggle('show', !navigator.onLine);
      document.querySelectorAll('[data-queue-id]').forEach(btn => {
        btn.disabled = !navigator.onLine;
        btn.classList.toggle('opacity-50', !navigator.onLine);
      });
    }
    window.addEventListener('online',  updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
  </script>

</body>
</html>
